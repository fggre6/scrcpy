name: Build scrcpy Server Only

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名（如 server-v1，留空则自动生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 编译服务端
        run: |
          chmod +x ./gradlew
          ./gradlew -p server assembleRelease
          ls -lh server/build/outputs/apk/release/

      - name: 重命名产物
        run: |
          mkdir -p output
          cp server/build/outputs/apk/release/server-release-unsigned.apk output/scrcpy-server
          ls -lh output/

      - name: 上传为 Actions 产物
        uses: actions/upload-artifact@v6
        with:
          name: scrcpy-server
          path: output/scrcpy-server

      - name: 生成标签名
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=server-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "scrcpy Server ${{ steps.tag.outputs.tag }}"
          body: |
            ## scrcpy 自定义服务端

            仅包含 `scrcpy-server`，用于替换客户端目录下的同名文件。

            ### 使用
            下载后直接覆盖你本地 scrcpy 目录里的 `scrcpy-server` 即可。

            编译时间：${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false
          files: output/scrcpy-server

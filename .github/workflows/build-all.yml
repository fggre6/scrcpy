name: Build & Release (all platforms)

# 多平台正式版构建与发布。
# - 仅 v* tag 与手动触发，避免 push 分支触发的高频运行
# - max-parallel: 2 限制矩阵并发，降低 GitHub 风控（Abuse Detection）风险
# - 不兼容变体只跳过，不影响其它变体
# - v* tag: 发布 GitHub Release；手动触发: 只上传 Artifact（保留 3 天）
# - 每个正式版压缩包都内置可视化按键映射设计器 tools/mapping-designer
# - 旧的单平台 build.yml 已改为手动触发，避免重复创建 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '产物版本名（留空则自动生成 build-YYYYmmdd-HHMMSS；手动触发不会创建 Release）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布版本（仅 v* tag 触发时作用于 Release）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 统一版本名，并决定本次是否发布 Release
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      publish_release: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: 释放 Ubuntu 磁盘空间
        shell: bash
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          echo "=== 清理后 ==="
          df -h /

      - name: 计算版本标签
        id: compute
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            tag="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="build-$(date -u +'%Y%m%d-%H%M%S')"
          fi
          if ! [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "标签名只能包含字母、数字、点、下划线和连字符: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "本次为 tag 触发，将发布 Release"
          else
            echo "本次为手动触发，只上传 Artifact"
          fi

  # Android 服务端（所有平台的客户端压缩包都要内置）
  server:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 释放 Ubuntu 磁盘空间
        shell: bash
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          echo "=== 清理后 ==="
          df -h /

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            server/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 编译 scrcpy-server
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew -p server assembleRelease
          mkdir -p release/work/build-server/server
          cp server/build/outputs/apk/release/server-release-unsigned.apk \
             release/work/build-server/server/scrcpy-server
          ls -lh release/work/build-server/server/scrcpy-server

      - name: 上传服务端产物
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server
          path: release/work/build-server/server/scrcpy-server
          retention-days: 3

  # 平台变体矩阵。skip=true 的变体在预检阶段直接跳过；
  # continue-on-error=true 保证任一变体失败不会阻断其它变体与最终发布。
  build:
    needs: [version, server]
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      # 严格限制同时运行的虚拟机数量，避免触发 GitHub 风控
      max-parallel: 2
      matrix:
        include:
          # ---------------- Linux ----------------
          - target: linux-x86_64
            runner: ubuntu-22.04
            family: linux
            script: release/build_linux.sh
            arg: x86_64
            format: tar.gz
            expected_arch: x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            family: linux
            script: release/build_linux.sh
            arg: aarch64
            format: tar.gz
            expected_arch: aarch64
          - target: linux-x86
            runner: ubuntu-24.04
            family: linux
            script: release/build_linux.sh
            arg: x86
            format: tar.gz
            expected_arch: i686
            skip: true   # 依赖构建脚本只支持 native 宿主架构，没有 i686 交叉工具链
          # ---------------- Windows ----------------
          - target: win32
            runner: ubuntu-22.04
            family: windows-cross
            script: release/build_windows.sh
            arg: '32'
            format: zip
            expected_arch: ''
          - target: win64
            runner: ubuntu-22.04
            family: windows-cross
            script: release/build_windows.sh
            arg: '64'
            format: zip
            expected_arch: ''
          - target: winarm64
            runner: windows-11-arm
            family: windows-arm
            script: release/build_windows.sh
            arg: arm64
            format: zip
            shell: 'msys2 {0}'
            expected_arch: ARM64
          # ---------------- macOS ----------------
          - target: macos-x86_64
            runner: macos-15-intel
            family: macos
            script: release/build_macos.sh
            arg: x86_64
            format: tar.gz
            expected_arch: x86_64
          - target: macos-aarch64
            runner: macos-latest
            family: macos
            script: release/build_macos.sh
            arg: aarch64
            format: tar.gz
            expected_arch: arm64

    steps:
      - name: 跳过不兼容变体
        if: matrix.skip == true
        shell: bash
        run: |
          echo "::warning::${{ matrix.target }} 在当前工具链下不兼容，已跳过该变体。"
          exit 1

      - uses: actions/checkout@v4

      - name: 释放 Ubuntu 磁盘空间
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          echo "=== 清理后 ==="
          df -h /

      # 缓存下载好的源码与已安装的依赖，避免每次重复下载
      - name: 缓存平台编译依赖
        uses: actions/cache@v4
        with:
          path: |
            app/deps/work/sources
            app/deps/work/install
          key: deps-${{ matrix.target }}-${{ hashFiles('app/deps/*.sh', 'app/deps/patches/**', 'cross_win*.txt', 'meson.build', 'meson_options.txt') }}
          restore-keys: |
            deps-${{ matrix.target }}-

      # 必须先于任何使用 msys2 shell 的步骤
      - name: 安装依赖（MSYS2 / Windows ARM64）
        if: matrix.family == 'windows-arm'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            base-devel
            unzip
            wget
            zip
            autoconf
            automake
            libtool
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-gcc-compat
            mingw-w64-clang-aarch64-meson
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-zlib

      - name: 校验 runner 架构
        if: matrix.expected_arch != ''
        shell: ${{ matrix.shell || 'bash' }}
        run: |
          expected='${{ matrix.expected_arch }}'
          if [ "$expected" = "ARM64" ]; then
            # MSYS2 工具在 x64 模拟下运行，uname -m 不可靠，改用 uname -s
            actual=$(uname -s)
          else
            actual=$(uname -m)
          fi
          echo "expected=$expected actual=$actual"
          case "$actual" in
            *"$expected"*) ;;
            *) echo "架构不匹配，跳过该变体。" >&2; exit 1 ;;
          esac

      - name: 安装依赖（Linux / macOS / Windows 交叉编译）
        if: matrix.family != 'windows-arm'
        shell: bash
        run: release/ci_deps.sh '${{ matrix.family }}'

      - name: 下载 scrcpy-server
        uses: actions/download-artifact@v4
        with:
          name: scrcpy-server
          path: release/work/build-server/server

      - name: 编译 ${{ matrix.target }}
        shell: ${{ matrix.shell || 'bash' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'
          VERSION: ${{ needs.version.outputs.tag }}
        run: '${{ matrix.script }} ${{ matrix.arg }}'

      - name: 打包正式版（含按键映射设计器）
        shell: ${{ matrix.shell || 'bash' }}
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: 'release/package_client.sh ${{ matrix.target }} ${{ matrix.format }}'

      - name: 上传正式版压缩包
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/output/scrcpy-${{ matrix.target }}-${{ needs.version.outputs.tag }}.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 3

  # 汇总所有成功构建的变体；只有 v* tag 触发才创建 Release
  release:
    needs: [version, server, build]
    if: always() && needs.version.result == 'success' && needs.server.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 释放 Ubuntu 磁盘空间
        shell: bash
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          echo "=== 清理后 ==="
          df -h /

      - name: 下载所有正式版压缩包
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/output
          merge-multiple: true

      - name: 校验产物并生成发布说明
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          TARGETS: >-
            linux-x86_64 linux-aarch64 linux-x86
            win32 win64 winarm64
            macos-x86_64 macos-aarch64
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          archives=(release/output/scrcpy-*.zip release/output/scrcpy-*.tar.gz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "没有任何变体构建成功，跳过发布。" >&2
            exit 1
          fi
          echo "本次发布包含 ${#archives[@]} 个压缩包："
          printf '  %s\n' "${archives[@]}"

          # 动态生成校验和，跳过的变体不会让这一步失败
          release/generate_checksums.sh

          {
            echo "## scrcpy 输入映射增强版"
            echo
            echo "基于上游 scrcpy v5.0.1，新增键盘/鼠标 → 触摸映射系统。"
            echo
            echo "### 本次发布的压缩包"
            echo
            for f in "${archives[@]}"; do
              echo "- \`$(basename "$f")\`"
            done
            echo
            echo "### 每个压缩包内含"
            echo
            echo "- \`scrcpy\` 可执行文件与 \`scrcpy-server\`"
            echo "- \`tools/mapping-designer/index.html\`：可视化按键映射 JSON 生成器（浏览器离线打开即可使用）"
            echo "- \`templates/\`：映射模板示例"
            echo "- \`scrcpy_mapping_config.json\`：全局映射配置"
            echo
            echo "### 默认快捷键"
            echo
            echo "| 快捷键 | 功能 |"
            echo "| --- | --- |"
            echo "| \`F2\` | 快速切换模板 |"
            echo "| \`F3\` | 进入/退出设计模式 |"
            echo "| \`F4\` | 开关按键映射 |"
            echo "| \`F5\` | 打开/关闭内建管理面板 |"
            echo
            echo "映射模板放在 \`templates/\`，在 \`scrcpy_mapping_config.json\` 中设置"
            echo "\`active_template\` 并将 \`enabled\` 设为 \`true\`；运行中修改会热重载。"
            echo
            echo "### 跳过的变体"
            echo
            skipped=0
            for t in $TARGETS; do
              found=0
              for f in "${archives[@]}"; do
                case "$(basename "$f")" in
                  "scrcpy-$t-"*) found=1 ;;
                esac
              done
              if [ "$found" -eq 0 ]; then
                echo "- \`$t\`（当前工具链不兼容或构建失败，已跳过）"
                skipped=1
              fi
            done
            if [ "$skipped" -eq 0 ]; then echo "- 无（全部变体构建成功）"; fi
          } > release/RELEASE_BODY.md

          cat release/RELEASE_BODY.md

      - name: 创建 Release 并推送（仅 v* tag 触发）
        if: needs.version.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "scrcpy 输入映射增强版 ${{ needs.version.outputs.tag }}"
          body_path: release/RELEASE_BODY.md
          prerelease: ${{ inputs.prerelease || false }}
          files: release/output/*

      - name: 手动触发：汇总 Artifact
        if: needs.version.outputs.publish_release != 'true'
        shell: bash
        run: |
          {
            echo "### 手动构建完成（未创建 Release）"
            echo
            echo "版本：\`${{ needs.version.outputs.tag }}\`"
            echo
            echo "压缩包已作为 Actions Artifact 上传，保留 3 天："
            echo
            shopt -s nullglob
            for f in release/output/*; do
              echo "- \`$(basename "$f")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

name: Build scrcpy Windows Client

on:
  push:
    branches:
      - 'master'      # 主分支：推送后自动编译并发布
      - 'trae/**'     # 功能分支：保留原有触发方式
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名（如 v1.0，留空则自动生成）'
        required: false
        default: ''

permissions:
  contents: write

env:
  SCRCPY_VERSION: '5.0.1'

jobs:
  # ==================== 编译服务端 ====================
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 编译服务端
        run: |
          # 注意：gradlew 在项目根目录
          chmod +x ./gradlew
          ./gradlew -p server assembleRelease
          ls -lh server/build/outputs/apk/release/

      - name: 上传服务端产物
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server
          path: server/build/outputs/apk/release/server-release-unsigned.apk

  # ==================== 编译 Windows 客户端 ====================
  build-windows:
    needs: build-server
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libusb
            zip

      - name: 下载服务端产物
        uses: actions/download-artifact@v4
        with:
          name: scrcpy-server
          path: server-artifact

      - name: 重命名服务端文件
        run: |
          mv server-artifact/server-release-unsigned.apk server-artifact/scrcpy-server
          ls -lh server-artifact/scrcpy-server

      - name: 配置 Meson
        run: |
          meson setup build --buildtype=release --strip \
            -Db_lto=true \
            -Dprebuilt_server=$(pwd)/server-artifact/scrcpy-server \
            -Dcompile_server=false

      - name: 编译
        run: ninja -C build

      - name: 收集运行时文件
        run: |
          mkdir -p dist/scrcpy-win64
          cp build/app/scrcpy.exe dist/scrcpy-win64/scrcpy.exe
          cp server-artifact/scrcpy-server dist/scrcpy-win64/scrcpy-server
          # 收集运行时需要的 MinGW DLL
          ldd build/app/scrcpy.exe | grep -E 'ucrt64|mingw64' | awk '{print $3}' | xargs -I{} cp {} dist/scrcpy-win64/ || true
          # 复制模板和配置
          if [ -d templates ]; then
            cp -r templates dist/scrcpy-win64/
          fi
          if [ -f scrcpy_mapping_config.json ]; then
            cp scrcpy_mapping_config.json dist/scrcpy-win64/
          fi
          # 打包成 payload.zip，供启动器内嵌
          cd dist/scrcpy-win64
          zip -rq ../payload.zip .
          cd ..
          ls -lh payload.zip

      - name: 编译单文件启动器
        run: |
          cd dist
          # 把 payload.zip 作为二进制数据段嵌入启动器
          objcopy -I binary -O pe-x86-64 -B i386:x86-64 payload.zip payload.o
          gcc -O2 -s -o scrcpy-portable.exe ../windows/portable_launcher.c payload.o
          ls -lh scrcpy-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/scrcpy-portable.exe

  # ==================== 创建 Release ====================
  release:
    needs: [build-server, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: artifacts

      - name: 列出文件
        run: find artifacts -type f -exec ls -lh {} \;

      - name: 生成标签名
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "scrcpy Windows Custom Build ${{ steps.tag.outputs.tag }}"
          body: |
            ## scrcpy 映射模板管理版本（Windows 64 位）

            基于 scrcpy 源码编译，集成了按键映射模板管理功能。

            ### 功能
            - **内置管理面板**（`F5`）：模板切换、条目增删改、坐标拾取、滑动编辑、映射开关
            - **JSON 模板格式**：坐标使用归一化值 (0.0~1.0)，适配任意手机分辨率
            - **热替换**：修改或切换模板后，SCRCPY 自动重新加载
            - **设计模式**：投屏中按快捷键进入，点击屏幕记录位置，按按键绑定
            - **快速切换**：按快捷键弹出模板列表，鼠标悬停自动切换
            - **开关映射**：快捷键一键启用/关闭按键映射

            ### 默认快捷键（可在 `scrcpy_mapping_config.json` 中修改）
            - `F2`：快速切换模板
            - `F3`：进入/退出设计模式
            - `F4`：开关按键映射
            - `F5`：打开/关闭内置管理面板

            ### 使用
            1. 下载并双击 `scrcpy-portable.exe` 即可投屏，无需解压、无需担心 DLL 散落或缺失。
            2. 首次运行会自动把运行文件释放到 `%LOCALAPPDATA%\scrcpy-portable\<版本哈希>\`，之后直接双击同一个 exe 即可。
            3. 按 `F5` 打开内置管理面板编辑模板；模板和配置保存在释放出的运行目录中，同一版本内修改会保留。

            编译时间：${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false
          files: artifacts/scrcpy-portable.exe

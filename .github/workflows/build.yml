name: Build scrcpy Windows Client

on:
  push:
    branches:
      - 'master'      # 主分支：推送后自动编译并发布
      - 'trae/**'     # 功能分支：保留原有触发方式
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名（如 v1.0，留空则自动生成）'
        required: false
        default: ''

permissions:
  contents: write

env:
  SCRCPY_VERSION: '5.0.1'

jobs:
  # ==================== 编译服务端 ====================
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 编译服务端
        run: |
          # 注意：gradlew 在项目根目录
          chmod +x ./gradlew
          ./gradlew -p server assembleRelease
          ls -lh server/build/outputs/apk/release/

      - name: 上传服务端产物
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server
          path: server/build/outputs/apk/release/server-release-unsigned.apk

  # ==================== 编译 Windows 客户端 ====================
  build-windows:
    needs: build-server
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libusb
            zip

      - name: 下载服务端产物
        uses: actions/download-artifact@v4
        with:
          name: scrcpy-server
          path: server-artifact

      - name: 重命名服务端文件
        run: |
          mv server-artifact/server-release-unsigned.apk server-artifact/scrcpy-server
          ls -lh server-artifact/scrcpy-server

      - name: 配置 Meson
        run: |
          meson setup build --buildtype=release --strip \
            -Db_lto=true \
            -Dprebuilt_server=$(pwd)/server-artifact/scrcpy-server \
            -Dcompile_server=false

      - name: 编译
        run: ninja -C build

      - name: 整理安装目录结构
        run: |
          mkdir -p dist/dll
          # 真正的程序和全部 DLL 一起放在硬编码的 dll\ 目录
          cp build/app/scrcpy.exe dist/dll/scrcpy-core.exe
          cp server-artifact/scrcpy-server dist/scrcpy-server
          # 安装程序用根目录的 version.txt 判断全新安装/升级，不依赖注册表
          echo "${SCRCPY_VERSION}.${{ github.run_number }}" > dist/version.txt
          ldd build/app/scrcpy.exe | grep -E 'ucrt64|mingw64' | awk '{print $3}' | xargs -I{} cp {} dist/dll/ || true
          if [ -d templates ]; then
            cp -r templates dist/templates
          fi
          if [ -f scrcpy_mapping_config.json ]; then
            cp scrcpy_mapping_config.json dist/
          fi
          find dist -maxdepth 2 -type f | head -20
          test "$(find dist/dll -type f | wc -l)" -gt 0
          echo "DLL count: $(find dist/dll -type f | wc -l)"

      - name: 编译目录启动器
        run: |
          gcc -O2 -s -o dist/scrcpy.exe windows/launcher.c
          ls -lh dist/scrcpy.exe

      - name: 生成安装程序
        run: |
          MAKENSIS=$(command -v makensis || true)
          if [ -z "$MAKENSIS" ]; then
            choco install nsis -y --no-progress >/dev/null
            MAKENSIS=$(command -v makensis || true)
          fi
          if [ -z "$MAKENSIS" ]; then
            MAKENSIS="/c/Program Files (x86)/NSIS/Bin/makensis.exe"
          fi
          test -x "$MAKENSIS"
          "$MAKENSIS" //DSRC_DIR="$(pwd)/dist" //DAPP_VERSION="${SCRCPY_VERSION}.${{ github.run_number }}" windows/installer.nsi
          ls -lh scrcpy-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: scrcpy-setup.exe

  # ==================== 创建 Release ====================
  release:
    needs: [build-server, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: artifacts

      - name: 列出文件
        run: find artifacts -type f -exec ls -lh {} \;

      - name: 生成标签名
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "scrcpy Windows Custom Build ${{ steps.tag.outputs.tag }}"
          body: |
            ## scrcpy 映射模板管理版本（Windows 64 位）

            基于 scrcpy 源码编译，集成了按键映射模板管理功能。

            ### 功能
            - **内置管理面板**（`F5`）：模板切换、条目增删改、坐标拾取、滑动编辑、映射开关
            - **JSON 模板格式**：坐标使用归一化值 (0.0~1.0)，适配任意手机分辨率
            - **热替换**：修改或切换模板后，SCRCPY 自动重新加载
            - **设计模式**：投屏中按快捷键进入，点击屏幕记录位置，按按键绑定
            - **快速切换**：按快捷键弹出模板列表，鼠标悬停自动切换
            - **开关映射**：快捷键一键启用/关闭按键映射

            ### 默认快捷键（可在 `scrcpy_mapping_config.json` 中修改）
            - `F2`：快速切换模板
            - `F3`：进入/退出设计模式
            - `F4`：开关按键映射
            - `F5`：打开/关闭内置管理面板

            ### 使用
            1. 下载并双击 `scrcpy-setup.exe`。安装程序会自动判断：首次使用直接安装，已安装过则升级，无需选择。
            2. 默认安装到 `%LOCALAPPDATA%\Programs\scrcpy`。真正的程序和全部 DLL 集中在 `dll\` 子目录，根目录只有启动器、配置和模板；不依赖 PATH 或注册表。
            3. 升级通过目录内的 `version.txt` 自动判断，会替换程序文件和 `dll\`，但保留 `scrcpy_mapping_config.json` 与 `templates\`，按 `F5` 可继续编辑原有模板。

            编译时间：${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false
          files: artifacts/scrcpy-setup.exe

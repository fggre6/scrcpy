[package]
name = "scrcpy-control-panel"
version = "1.0.0"
description = "Tauri control panel for scrcpy"
authors = ["fggre6"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "scrcpy_control_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
